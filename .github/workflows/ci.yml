name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Swift Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test
